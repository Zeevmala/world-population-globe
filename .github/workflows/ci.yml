name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # eslint → unit tests → tsc -b → vite build: the same single exit code as local.
      - run: npm run verify
      # Σ-pop, H3 roll-up, CRS bounds and per-file size over the committed data (~20 s).
      - run: npm run verify:data
      # specs/TODO.md is the factory's state file — a malformed queue halts or misleads it.
      - run: npm run queue -- lint
